[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pendulum_rl"
version = "0.1.0"
description = "n-link inverted pendulum swing-up in MuJoCo: classical control baselines and RL, studied mathematically"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "mujoco>=3.2", "gymnasium>=1.0"]

[project.optional-dependencies]
rl = ["torch", "tensorboard"]
analysis = ["sympy", "matplotlib", "imageio[ffmpeg]"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["pendulum_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
